name: Build A.K Journal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract A.K Journal project
        run: |
          unzip -o AK_Journal_Project.zip -d build-project
          cd build-project
          find . -maxdepth 2 -type f | head -50

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: build-project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AK-Journal-APK
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
